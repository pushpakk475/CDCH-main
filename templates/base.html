<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Circuitron{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-container">
                {% for cat, msg in messages %}
                    <div class="flash flash-{{ cat }}">{{ msg }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}

    <script>
    // Auto back button on all inner pages
    (function() {
        const navbar = document.querySelector('.navbar .nav-links');
        if (navbar && window.location.pathname !== '/') {
            const btn = document.createElement('button');
            btn.className = 'btn-back';
            btn.innerHTML = '&#8592; Back';
            btn.onclick = () => history.back();
            navbar.prepend(btn);
        }
    })();
    </script>
</body>
</html>
