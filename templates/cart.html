<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Marcos Electrical</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Shopping Cart</h1>
        <a href="{{ url_for('home') }}" class="btn btn-back">← Back to Home</a>
        
        {% if cart %}
        <div class="cart-items">
            {% for item in cart %}
            <div class="cart-item">
                <div class="item-info">
                    <h3>{{ item.name }}</h3>
                    <span class="category-badge">{{ item.category }}</span>
                </div>
                <p class="price">₹{{ "%.2f"|format(item.price) }}</p>
            </div>
            {% endfor %}
        </div>
        
        <div class="cart-total">
            <h2>Total: ₹{{ "%.2f"|format(total) }}</h2>
        </div>
        
        <div class="button-group">
            <a href="{{ url_for('clear_cart') }}" class="btn btn-danger">Clear Cart</a>
            <a href="{{ url_for('view_products') }}" class="btn btn-primary">Continue Shopping</a>
        </div>
        {% else %}
        <div class="empty-cart">
            <p>Your cart is empty</p>
            <a href="{{ url_for('view_products') }}" class="btn btn-primary">Browse Products</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
