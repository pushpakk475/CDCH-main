{% extends 'base.html' %}
{% block title %}Book {{ service.name }} – Circuitron{% endblock %}
{% block content %}
<nav class="navbar">
    <a class="nav-brand" href="{{ url_for('home') }}">⚡ Circuitron</a>
</nav>
<div class="auth-page">
    <div class="auth-card" style="max-width:500px">
        <div style="font-size:3rem;text-align:center">{{ service.icon }}</div>
        <h2 style="text-align:center">Book {{ service.name }}</h2>
        <form method="POST">
            <div class="form-group">
                <label>Describe the Issue</label>
                <textarea name="description" rows="3" placeholder="Describe what needs to be done..."></textarea>
            </div>
            <div class="form-group">
                <label>Preferred Date</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>Time Slot</label>
                <select name="time_slot">
                    <option>9:00 AM – 11:00 AM</option>
                    <option>11:00 AM – 1:00 PM</option>
                    <option>2:00 PM – 4:00 PM</option>
                    <option>4:00 PM – 6:00 PM</option>
                </select>
            </div>
            <div class="form-group">
                <label>Service Address</label>
                <textarea name="address" rows="2" required placeholder="Where should the electrician come?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Confirm Booking</button>
        </form>
        <p class="auth-link"><a href="{{ url_for('services') }}">← Back to Services</a></p>
    </div>
</div>
{% endblock %}
