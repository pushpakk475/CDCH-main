<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Marcos Electrical</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Our Products</h1>
        <a href="{{ url_for('home') }}" class="btn btn-back">← Back to Home</a>
        
        <div class="products-grid">
            {% for product in products %}
            <div class="product-card">
                <div class="product-image">
                    <img src="{{ url_for('static', filename='images/' + product.image) }}" alt="{{ product.name }}" onerror="this.src='{{ url_for('static', filename='images/placeholder.svg') }}'">>
                </div>
                <span class="category-badge">{{ product.category }}</span>
                <h3>{{ product.name }}</h3>
                <p class="price">₹{{ "%.2f"|format(product.price) }}</p>
                <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="btn btn-add">Add to Cart</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
