<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="300" height="180" fill="url(#bg)"/>
  <!-- Coil rings -->
  <circle cx="110" cy="90" r="62" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="22"/>
  <circle cx="110" cy="90" r="62" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="14"/>
  <circle cx="110" cy="90" r="62" fill="none" stroke="white" stroke-width="6" filter="url(#glow)"/>
  <circle cx="110" cy="90" r="28" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <circle cx="110" cy="90" r="14" fill="rgba(255,255,255,0.4)"/>
  <!-- Wire ends -->
  <rect x="190" y="55" width="75" height="16" rx="8" fill="rgba(255,255,255,0.9)" filter="url(#glow)"/>
  <rect x="190" y="77" width="75" height="16" rx="8" fill="rgba(255,255,255,0.6)"/>
  <rect x="190" y="99" width="75" height="16" rx="8" fill="rgba(255,255,255,0.4)"/>
  <!-- Copper tips -->
  <rect x="258" y="55" width="14" height="16" rx="4" fill="#fbbf24"/>
  <rect x="258" y="77" width="14" height="16" rx="4" fill="#fbbf24"/>
  <rect x="258" y="99" width="14" height="16" rx="4" fill="#fbbf24"/>
  <!-- Neon accents -->
  <circle cx="270" cy="155" r="10" fill="#fde68a" opacity="0.6" filter="url(#glow)"/>
  <circle cx="20" cy="25" r="7" fill="white" opacity="0.4" filter="url(#glow)"/>
</svg>
