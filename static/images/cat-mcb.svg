  <rect x="118" y="55" width="10" height="18" rx="3" fill="white" filter="url(#glow)"/>
  <text x="123" y="49" font-family="Arial" font-size="8" fill="#0369a1" text-anchor="middle" font-weight="bold">63A</text>
