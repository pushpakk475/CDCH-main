<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="300" height="180" fill="url(#bg)"/>
  <!-- Glass card -->
  <rect x="55" y="25" width="85" height="130" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <rect x="70" y="45" width="55" height="70" rx="10" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <rect x="78" y="53" width="39" height="28" rx="7" fill="white" filter="url(#glow)"/>
  <rect x="78" y="87" width="39" height="18" rx="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="97" cy="130" r="6" fill="rgba(255,255,255,0.6)" stroke="white" stroke-width="1.5"/>
  <!-- Second card -->
  <rect x="160" y="25" width="85" height="130" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <rect x="175" y="45" width="55" height="70" rx="10" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <circle cx="202" cy="65" r="14" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="1.5"/>
  <circle cx="202" cy="65" r="8" fill="white" filter="url(#glow)"/>
  <rect x="178" y="87" width="24" height="18" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="208" y="87" width="18" height="18" rx="5" fill="rgba(255,255,255,0.3)"/>
  <!-- Neon dot -->
  <circle cx="270" cy="20" r="8" fill="#a78bfa" filter="url(#glow)" opacity="0.8"/>
  <circle cx="30" cy="160" r="12" fill="#818cf8" filter="url(#glow)" opacity="0.5"/>
</svg>
