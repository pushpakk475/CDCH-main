<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="bulbglow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="300" height="180" fill="url(#bg)"/>
  <!-- Glow halo -->
  <ellipse cx="150" cy="80" rx="75" ry="65" fill="url(#bulbglow)"/>
  <!-- Bulb shape -->
  <path d="M122,100 Q112,65 150,50 Q188,65 178,100 L173,115 L127,115 Z" fill="#fef9c3" filter="url(#glow)"/>
  <path d="M122,100 Q112,65 150,50 Q188,65 178,100 L173,115 L127,115 Z" fill="none" stroke="#fde047" stroke-width="2" opacity="0.7"/>
  <!-- Filament -->
  <path d="M138,90 L143,78 L150,88 L157,72 L162,90" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Base -->
  <rect x="130" y="115" width="40" height="9" rx="2" fill="#6b7280"/>
  <rect x="132" y="124" width="36" height="7" rx="2" fill="#4b5563"/>
  <rect x="134" y="131" width="32" height="7" rx="2" fill="#374151"/>
  <rect x="137" y="138" width="26" height="9" rx="3" fill="#1f2937"/>
  <!-- Rays -->
  <line x1="150" y1="35" x2="150" y2="20" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="198" y1="55" x2="208" y2="44" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="102" y1="55" x2="92" y2="44" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="215" y1="85" x2="228" y2="85" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="85" y1="85" x2="72" y2="85" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Stars -->
  <circle cx="40" cy="30" r="2" fill="white" opacity="0.6"/>
  <circle cx="260" cy="50" r="2" fill="white" opacity="0.5"/>
  <circle cx="70" cy="150" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="240" cy="140" r="2" fill="white" opacity="0.5"/>
</svg>
