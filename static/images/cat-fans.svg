<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="300" height="180" fill="url(#bg)"/>
  <!-- Mount -->
  <rect x="138" y="8" width="24" height="16" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="146" y="24" width="8" height="22" rx="3" fill="rgba(255,255,255,0.4)"/>
  <!-- Blades -->
  <ellipse cx="150" cy="55" rx="12" ry="34" fill="url(#blade)" transform="rotate(0 150 90)" filter="url(#glow)"/>
  <ellipse cx="150" cy="55" rx="12" ry="34" fill="url(#blade)" transform="rotate(72 150 90)" opacity="0.85"/>
  <ellipse cx="150" cy="55" rx="12" ry="34" fill="url(#blade)" transform="rotate(144 150 90)" opacity="0.7"/>
  <ellipse cx="150" cy="55" rx="12" ry="34" fill="url(#blade)" transform="rotate(216 150 90)" opacity="0.85"/>
  <ellipse cx="150" cy="55" rx="12" ry="34" fill="url(#blade)" transform="rotate(288 150 90)" opacity="0.95"/>
  <!-- Hub -->
  <circle cx="150" cy="90" r="20" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  <circle cx="150" cy="90" r="12" fill="rgba(255,255,255,0.5)" filter="url(#glow)"/>
  <circle cx="150" cy="90" r="5" fill="white"/>
  <!-- Speed dots -->
  <circle cx="115" cy="155" r="6" fill="rgba(255,255,255,0.9)" filter="url(#glow)"/>
  <circle cx="132" cy="155" r="6" fill="rgba(255,255,255,0.6)"/>
  <circle cx="149" cy="155" r="6" fill="rgba(255,255,255,0.3)"/>
  <!-- Neon accents -->
  <circle cx="265" cy="25" r="10" fill="rgba(255,255,255,0.2)" filter="url(#glow)"/>
  <circle cx="35" cy="155" r="8" fill="rgba(255,255,255,0.15)" filter="url(#glow)"/>
</svg>
