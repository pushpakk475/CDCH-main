  <rect x="670" y="153" width="20" height="28" rx="3" fill="white" opacity="0.85"/>
  <circle cx="690" cy="222" r="14" fill="#c62828" stroke="rgba(255,100,100,0.5)" stroke-width="1.5" filter="url(#gf)"/>
  <text x="690" y="226" font-family="Arial" font-size="8" fill="white" text-anchor="middle" font-weight="bold">TEST</text>
  <ellipse cx="690" cy="272" rx="45" ry="10" fill="rgba(100,150,255,0.25)" filter="url(#blur4)"/>

  <!-- Capacitors -->
  <ellipse cx="800" cy="160" rx="18" ry="28" fill="#1a1a00" stroke="rgba(255,220,0,0.5)" stroke-width="1.5"/>
  <ellipse cx="800" cy="160" rx="14" ry="24" fill="#2a2a00"/>
  <line x1="800" y1="132" x2="800" y2="120" stroke="rgba(255,220,0,0.7)" stroke-width="2"/>
  <line x1="800" y1="188" x2="800" y2="200" stroke="rgba(255,220,0,0.7)" stroke-width="2"/>
  <ellipse cx="800" cy="160" rx="18" ry="28" fill="rgba(255,220,0,0.08)" filter="url(#blur4)"/>

  <ellipse cx="840" cy="160" rx="18" ry="28" fill="#1a1a00" stroke="rgba(255,220,0,0.5)" stroke-width="1.5"/>
  <ellipse cx="840" cy="160" rx="14" ry="24" fill="#2a2a00"/>
  <line x1="840" y1="132" x2="840" y2="120" stroke="rgba(255,220,0,0.7)" stroke-width="2"/>
  <line x1="840" y1="188" x2="840" y2="200" stroke="rgba(255,220,0,0.7)" stroke-width="2"/>

  <!-- IC Chip -->
  <rect x="880" y="200" width="80" height="60" rx="4" fill="#111" stroke="rgba(0,255,136,0.4)" stroke-width="1.5"/>
  <rect x="885" y="205" width="70" height="50" rx="3" fill="#1a1a1a"/>
  <text x="920" y="232" font-family="Arial" font-size="9" fill="rgba(0,255,136,0.8)" text-anchor="middle">MCU</text>
  <text x="920" y="244" font-family="Arial" font-size="7" fill="rgba(0,255,136,0.5)" text-anchor="middle">32A-PRO</text>
  <!-- IC pins -->
  <g stroke="rgba(0,255,136,0.5)" stroke-width="1.5">
    <line x1="880" y1="215" x2="870" y2="215"/><line x1="880" y1="225" x2="870" y2="225"/>
    <line x1="880" y1="235" x2="870" y2="235"/><line x1="880" y1="245" x2="870" y2="245"/>
    <line x1="960" y1="215" x2="970" y2="215"/><line x1="960" y1="225" x2="970" y2="225"/>
    <line x1="960" y1="235" x2="970" y2="235"/><line x1="960" y1="245" x2="970" y2="245"/>
    <line x1="900" y1="200" x2="900" y2="190"/><line x1="920" y1="200" x2="920" y2="190"/>
    <line x1="940" y1="200" x2="940" y2="190"/><line x1="900" y1="260" x2="900" y2="270"/>
    <line x1="920" y1="260" x2="920" y2="270"/><line x1="940" y1="260" x2="940" y2="270"/>
  </g>
  <ellipse cx="920" cy="230" rx="50" ry="20" fill="rgba(0,255,136,0.06)" filter="url(#blur8)"/>

  <!-- LED indicators on board -->
  <circle cx="430" cy="310" r="6" fill="#ff3333" filter="url(#gf)"/>
  <circle cx="430" cy="310" r="10" fill="rgba(255,50,50,0.2)" filter="url(#blur4)"/>
  <circle cx="460" cy="310" r="6" fill="#33ff33" filter="url(#gf)"/>
  <circle cx="460" cy="310" r="10" fill="rgba(50,255,50,0.2)" filter="url(#blur4)"/>
  <circle cx="490" cy="310" r="6" fill="#3333ff" filter="url(#gf)"/>
  <circle cx="490" cy="310" r="10" fill="rgba(50,50,255,0.2)" filter="url(#blur4)"/>
  <circle cx="520" cy="310" r="6" fill="#ffff33" filter="url(#gf)"/>
  <circle cx="520" cy="310" r="10" fill="rgba(255,255,50,0.2)" filter="url(#blur4)"/>

  <!-- Connector terminals -->
  <rect x="390" y="400" width="600" height="30" rx="4" fill="#0a0a0a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <g fill="#1a1a1a" stroke="rgba(255,200,0,0.4)" stroke-width="1">
    <rect x="400" y="405" width="18" height="20" rx="2"/>
    <rect x="425" y="405" width="18" height="20" rx="2"/>
    <rect x="450" y="405" width="18" height="20" rx="2"/>
    <rect x="475" y="405" width="18" height="20" rx="2"/>
    <rect x="500" y="405" width="18" height="20" rx="2"/>
    <rect x="525" y="405" width="18" height="20" rx="2"/>
    <rect x="550" y="405" width="18" height="20" rx="2"/>
    <rect x="575" y="405" width="18" height="20" rx="2"/>
    <rect x="600" y="405" width="18" height="20" rx="2"/>
    <rect x="625" y="405" width="18" height="20" rx="2"/>
    <rect x="650" y="405" width="18" height="20" rx="2"/>
    <rect x="675" y="405" width="18" height="20" rx="2"/>
    <rect x="700" y="405" width="18" height="20" rx="2"/>
    <rect x="725" y="405" width="18" height="20" rx="2"/>
    <rect x="750" y="405" width="18" height="20" rx="2"/>
    <rect x="775" y="405" width="18" height="20" rx="2"/>
    <rect x="800" y="405" width="18" height="20" rx="2"/>
    <rect x="825" y="405" width="18" height="20" rx="2"/>
    <rect x="850" y="405" width="18" height="20" rx="2"/>
    <rect x="875" y="405" width="18" height="20" rx="2"/>
    <rect x="900" y="405" width="18" height="20" rx="2"/>
    <rect x="925" y="405" width="18" height="20" rx="2"/>
    <rect x="950" y="405" width="18" height="20" rx="2"/>
    <rect x="975" y="405" width="18" height="20" rx="2"/>
  </g>

  <!-- Ambient glow effects -->
  <ellipse cx="690" cy="280" rx="200" ry="150" fill="url(#glow1)" filter="url(#blur12)"/>
  <ellipse cx="500" cy="200" rx="150" ry="100" fill="url(#glow2)" filter="url(#blur12)"/>

  <!-- Floating particles outside board -->
  <circle cx="200" cy="150" r="3" fill="rgba(0,255,136,0.6)" filter="url(#gf)"/>
  <circle cx="250" cy="300" r="2" fill="rgba(255,80,80,0.6)" filter="url(#gf)"/>
  <circle cx="180" cy="420" r="3" fill="rgba(80,130,255,0.6)" filter="url(#gf)"/>
  <circle cx="1150" cy="180" r="3" fill="rgba(0,255,136,0.5)" filter="url(#gf)"/>
  <circle cx="1200" cy="350" r="2" fill="rgba(255,220,0,0.6)" filter="url(#gf)"/>
  <circle cx="1250" cy="250" r="3" fill="rgba(255,80,80,0.5)" filter="url(#gf)"/>

  <!-- Connecting wires outside board -->
  <path d="M370 200 L200 200 L200 350 L100 350" stroke="rgba(255,80,80,0.3)" stroke-width="2" fill="none" stroke-dasharray="8 4"/>
  <path d="M370 300 L250 300 L250 450 L150 450" stroke="rgba(0,255,136,0.3)" stroke-width="2" fill="none" stroke-dasharray="8 4"/>
  <path d="M1050 250 L1200 250 L1200 150 L1350 150" stroke="rgba(80,130,255,0.3)" stroke-width="2" fill="none" stroke-dasharray="8 4"/>
</svg>
